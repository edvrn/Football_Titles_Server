    <rect x="10" y="10" width="680" height="100" fill="none" stroke="white" stroke-width="2" rx="8" stroke-dasharray="5,5"/>
    <text x="350" y="45" text-anchor="middle" fill="white" font-size="32" font-weight="bold">🔄 Замена</text>
    <text x="350" y="75" text-anchor="middle" fill="white" font-size="22">{{playerOut}} → {{playerIn}}</text>
